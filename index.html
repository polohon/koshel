<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<title>Кошель</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #121212; color: #fff; margin: 0;
    padding: 10px; padding-bottom: 90px;
    user-select: none; -webkit-user-select: none;
  }
  h1 { font-size: 18px; text-align: center; margin: 0 0 8px; color: #eee; }

  .month-nav {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin-bottom: 10px;
  }
  .month-nav button {
    background: #2a2a2a; color: #fff; border: none;
    padding: 6px 12px; border-radius: 8px; font-size: 16px;
    cursor: pointer;
  }
  .month-nav .month-title {
    font-size: 17px; font-weight: 700; min-width: 150px; text-align: center;
  }

  .top-bar {
    display: flex; justify-content: center; gap: 5px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .top-bar button {
    background: #2a2a2a; color: #fff; border: none;
    padding: 7px 10px; border-radius: 8px; font-size: 11px;
    font-weight: 600; cursor: pointer;
  }
  .top-bar button:active { transform: scale(0.97); }

  .summary {
    background: #1e1e1e; border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .summary h2 {
    font-size: 14px; color: #888; margin: 0 0 10px;
    text-transform: uppercase; font-weight: 600;
  }
  .summary-row {
    display: flex; justify-content: space-between;
    font-size: 14px; padding: 5px 0; color: #bbb;
  }
  .summary-row b { color: #fff; font-weight: 700; }
  .summary-row .amount { font-family: ui-monospace, monospace; }
  .summary-row.positive .amount { color: #4caf50; }
  .summary-row.negative .amount { color: #f44336; }
  .summary-row.accent .amount { color: #4fc3f7; }

  .summary-divider { height: 1px; background: #333; margin: 8px 0; }

  .big-amount {
    font-size: 24px; font-weight: 800;
    font-family: ui-monospace, monospace;
    text-align: center; padding: 12px 0;
  }
  .big-amount.positive { color: #4caf50; }
  .big-amount.negative { color: #f44336; }

  .actions {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 12px;
  }
  .actions button {
    padding: 14px 10px; border: none; border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    color: #fff;
  }
  .actions button:active { transform: scale(0.97); }
  .actions .full { grid-column: 1 / -1; }
  .btn-tip    { background: #4caf50; }
  .btn-shift  { background: #2196f3; }
  .btn-expense{ background: #f44336; }
  .btn-advance{ background: #ff9800; }
  .btn-salary { background: #9c27b0; }

  .history {
    background: #1e1e1e; border-radius: 12px; padding: 12px;
    margin-bottom: 12px;
  }
  .history h2 {
    font-size: 14px; color: #888; margin: 0 0 10px;
    text-transform: uppercase; font-weight: 600;
  }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #2a2a2a;
    font-size: 13px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .type-icon { margin-right: 6px; }
  .history-item .date { color: #888; font-size: 11px; }
  .history-item .amount {
    font-family: ui-monospace, monospace;
    font-weight: 700;
  }
  .history-item .amount.income { color: #4caf50; }
  .history-item .amount.expense { color: #f44336; }
  .history-item .amount.neutral { color: #4fc3f7; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #1e1e1e; border-radius: 14px; padding: 18px;
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 14px; font-size: 17px; }
  .modal label {
    display: block; margin-bottom: 12px;
    font-size: 13px; color: #888;
  }
  .modal label input, .modal label select {
    display: block; width: 100%; margin-top: 4px;
    padding: 10px; background: #121212; color: #fff;
    border: 1px solid #333; border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
  }
  .modal label input:focus, .modal label select:focus {
    outline: none; border-color: #4fc3f7;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 12px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn-save { background: #4caf50; color: #fff; }
  .btn-cancel { background: #444; color: #fff; }
  .btn-danger { background: #f44336; color: #fff; }

  .date-quick {
    display: flex; gap: 6px; margin-top: 6px;
  }
  .date-quick button {
    flex: 1; padding: 8px; border: none; border-radius: 6px;
    background: #2a2a2a; color: #fff; font-size: 12px;
    cursor: pointer; font-weight: 600;
  }
  .date-quick button:active { background: #4fc3f7; color: #000; }

  .profit-preview {
    background: #121212; border-radius: 8px;
    padding: 10px; margin: 10px 0;
    font-size: 13px; color: #bbb;
  }
  .profit-preview .row {
    display: flex; justify-content: space-between;
    padding: 3px 0;
  }
  .profit-preview .row b { color: #fff; }
  .profit-preview .row.diff {
    padding-top: 8px; margin-top: 8px;
    border-top: 1px solid #333; font-size: 15px;
  }
  .profit-preview .row.diff b { color: #4fc3f7; font-size: 16px; }
  .profit-preview .row.diff.positive b { color: #4caf50; }
  .profit-preview .row.diff.negative b { color: #f44336; }

  .empty {
    text-align: center; color: #666;
    padding: 20px; font-size: 13px;
  }

  .chart-days {
    display: flex; align-items: flex-end;
    height: 180px; gap: 2px;
    padding: 10px 0 20px 0; margin: 10px 0;
    border-bottom: 1px solid #333;
    overflow-x: auto;
  }
  .chart-day-col {
    flex: 1;
    min-width: 8px;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    gap: 1px;
    position: relative;
  }
  .chart-day-col .bar-in {
    width: 100%;
    background: #4caf50;
    border-radius: 2px 2px 0 0;
    min-height: 2px;
  }
  .chart-day-col .bar-out {
    width: 100%;
    background: #f44336;
    border-radius: 0 0 2px 2px;
    min-height: 2px;
  }
  .chart-day-col .day-num {
    font-size: 9px; color: #666;
    position: absolute; bottom: -16px;
  }
  .chart-legend {
    display: flex; gap: 14px; justify-content: center;
    font-size: 11px; color: #888; margin-top: 8px;
  }
  .chart-legend span::before {
    content: ''; display: inline-block;
    width: 10px; height: 10px; border-radius: 2px;
    margin-right: 4px; vertical-align: middle;
  }
  .chart-legend .green::before { background: #4caf50; }
  .chart-legend .red::before { background: #f44336; }
  .chart-legend .yellow::before { background: #ffc107; }

  .pie-wrap {
    display: flex; align-items: center; gap: 16px;
    margin: 12px 0;
  }
  .pie {
    width: 130px; height: 130px; border-radius: 50%;
    flex-shrink: 0;
    position: relative;
  }
  .pie::after {
    content: ''; position: absolute;
    inset: 28px; background: #1e1e1e;
    border-radius: 50%;
  }
  .pie-legend {
    flex: 1;
    font-size: 12px;
    min-width: 0;
  }
  .pie-legend-row {
    display: flex; justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid #2a2a2a;
    gap: 8px;
  }
  .pie-legend-row:last-child { border-bottom: none; }
  .pie-legend-row > span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pie-legend-row .color-dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 6px;
    vertical-align: middle;
  }
  .pie-legend-row .amount {
    font-family: ui-monospace, monospace;
    color: #fff; font-weight: 700;
    white-space: nowrap;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin: 10px 0;
  }
  .cal-head {
    text-align: center; font-size: 11px;
    color: #888; padding: 4px 0;
    font-weight: 600;
  }
  .cal-day {
    aspect-ratio: 1;
    background: #121212;
    border-radius: 6px;
    padding: 4px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    font-size: 11px;
    border: 1px solid transparent;
    min-height: 42px;
  }
  .cal-day.empty-day { visibility: hidden; }
  .cal-day .day-num { color: #888; font-weight: 600; font-size: 12px; }
  .cal-day .day-amount {
    font-size: 9px;
    font-family: ui-monospace, monospace;
    color: #fff;
    text-align: right;
    font-weight: 700;
  }
  .cal-day.green { background: #1b3a1e; }
  .cal-day.green .day-amount { color: #66bb6a; }
  .cal-day.yellow { background: #3a341b; }
  .cal-day.yellow .day-amount { color: #ffc107; }
  .cal-day.red { background: #3a1b1b; }
  .cal-day.red .day-amount { color: #ef5350; }
  .cal-day.today { border-color: #4fc3f7; }
  .cal-day:active { transform: scale(0.95); }

  .debt-tabs {
    display: flex; gap: 6px; margin-bottom: 12px;
  }
  .debt-tabs button {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    background: #2a2a2a; color: #fff; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }
  .debt-tabs button.active {
    background: #4fc3f7; color: #000;
  }
  .debt-item {
    background: #121212; border-radius: 10px;
    padding: 12px; margin-bottom: 8px;
  }
  .debt-item .top {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 6px;
  }
  .debt-item .name { font-weight: 700; font-size: 14px; }
  .debt-item .sum {
    font-family: ui-monospace, monospace;
    font-weight: 700; font-size: 15px;
  }
  .debt-item .sum.i-owe { color: #f44336; }
  .debt-item .sum.owe-me { color: #4caf50; }
  .debt-item .bottom {
    display: flex; justify-content: space-between;
    align-items: center; font-size: 11px; color: #888;
  }
  .debt-item .btn-close-debt {
    background: #4caf50; color: #fff; border: none;
    padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .debt-item.closed { opacity: 0.5; }
  .debt-item.closed .btn-close-debt { display: none; }
</style>
</head>
<body>

<h1>💰 Кошель</h1>

<div class="top-bar">
  <button id="reportBtn">📊 Отчёт</button>
  <button id="calendarBtn">📅 Календарь</button>
  <button id="debtsBtn">💳 Долги</button>
  <button id="settingsBtn">⚙️ Категории</button>
  <button id="exportBtn">💾 CSV</button>
</div>

<div class="month-nav">
  <button id="prevMonth">◀</button>
  <div class="month-title" id="monthTitle">Сентябрь 2026</div>
  <button id="nextMonth">▶</button>
</div>

<div class="summary" id="summary"></div>

<div class="actions">
  <button class="btn-shift" id="shiftBtn">📊 Смена</button>
  <button class="btn-tip" id="tipBtn">💵 Чаевые</button>
  <button class="btn-expense" id="expenseBtn">➖ Расход</button>
  <button class="btn-advance" id="advanceBtn">🏦 Аванс</button>
  <button class="btn-salary full" id="salaryBtn">💼 Получил ЗП</button>
</div>

<div class="history">
  <h2>📋 Последние операции</h2>
  <div id="historyList"></div>
</div>

<!-- Модалка: Смена -->
<div class="modal-bg" id="shiftModal">
  <div class="modal">
    <h3>📊 Смена</h3>
    <label>Дата
      <input type="date" id="shiftDate">
      <div class="date-quick">
        <button type="button" data-date-target="shiftDate" data-date-val="today">Сегодня</button>
        <button type="button" data-date-target="shiftDate" data-date-val="yesterday">Вчера</button>
      </div>
    </label>
    <label>ЗП за смену (₽)
      <input type="number" id="shiftSalary" placeholder="0" inputmode="numeric">
    </label>
    <label>Чаевые (₽)
      <input type="number" id="shiftTips" placeholder="0" inputmode="numeric">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveShift">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка: Чаевые -->
<div class="modal-bg" id="tipModal">
  <div class="modal">
    <h3>💵 Чаевые</h3>
    <label>Дата
      <input type="date" id="tipDate">
      <div class="date-quick">
        <button type="button" data-date-target="tipDate" data-date-val="today">Сегодня</button>
        <button type="button" data-date-target="tipDate" data-date-val="yesterday">Вчера</button>
      </div>
    </label>
    <label>Сумма (₽)
      <input type="number" id="tipAmount" placeholder="0" inputmode="numeric">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveTip">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка: Расход -->
<div class="modal-bg" id="expenseModal">
  <div class="modal">
    <h3>➖ Расход</h3>
    <label>Дата
      <input type="date" id="expenseDate">
      <div class="date-quick">
        <button type="button" data-date-target="expenseDate" data-date-val="today">Сегодня</button>
        <button type="button" data-date-target="expenseDate" data-date-val="yesterday">Вчера</button>
      </div>
    </label>
    <label>Сумма (₽)
      <input type="number" id="expenseAmount" placeholder="0" inputmode="numeric">
    </label>
    <label>Категория
      <select id="expenseCategory"></select>
    </label>
    <label>Заметка (необязательно)
      <input type="text" id="expenseNote" placeholder="">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveExpense">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка: Аванс -->
<div class="modal-bg" id="advanceModal">
  <div class="modal">
    <h3>🏦 Аванс</h3>
    <label>Дата
      <input type="date" id="advanceDate">
      <div class="date-quick">
        <button type="button" data-date-target="advanceDate" data-date-val="today">Сегодня</button>
        <button type="button" data-date-target="advanceDate" data-date-val="yesterday">Вчера</button>
      </div>
    </label>
    <label>Сумма (₽)
      <input type="number" id="advanceAmount" placeholder="0" inputmode="numeric">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveAdvance">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка: Получил ЗП -->
<div class="modal-bg" id="salaryModal">
  <div class="modal">
    <h3 id="salaryTitle">💼 Получил ЗП</h3>
    <div class="profit-preview" id="salaryPreview"></div>
    <label>Фактически получил (₽)
      <input type="number" id="salaryFact" placeholder="0" inputmode="numeric">
    </label>
    <div class="profit-preview" id="salaryDiff" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveSalary">Закрыть месяц</button>
    </div>
  </div>
</div>

<!-- Модалка: Отчёт -->
<div class="modal-bg" id="reportModal">
  <div class="modal">
    <h3>📊 Отчёт за месяц</h3>
    <div id="reportContent"></div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Закрыть</button>
    </div>
  </div>
</div>

<!-- Модалка: Календарь -->
<div class="modal-bg" id="calendarModal">
  <div class="modal">
    <h3 id="calendarTitle">📅 Календарь</h3>
    <div class="cal-grid" id="calendarGrid"></div>
    <div class="chart-legend" style="margin-top:12px;">
      <span class="green">заработал</span>
      <span class="yellow">частично</span>
      <span class="red">только расход</span>
    </div>
    <div id="calendarDayDetail" style="margin-top:12px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Закрыть</button>
    </div>
  </div>
</div>

<!-- Модалка: Долги -->
<div class="modal-bg" id="debtsModal">
  <div class="modal">
    <h3>💳 Долги</h3>
    <div class="debt-tabs">
      <button id="tabIOwe" class="active">Я должен</button>
      <button id="tabOweMe">Мне должны</button>
    </div>
    <div id="debtsList"></div>
    <button class="btn-save" id="addDebtBtn" style="width:100%;margin-top:12px;">➕ Добавить долг</button>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Закрыть</button>
    </div>
  </div>
</div>

<!-- Модалка: Добавить долг -->
<div class="modal-bg" id="debtAddModal">
  <div class="modal">
    <h3>💳 Новый долг</h3>
    <label>Тип
      <select id="debtType">
        <option value="i-owe">Я должен</option>
        <option value="owe-me">Мне должны</option>
      </select>
    </label>
    <label>Имя
      <input type="text" id="debtName" placeholder="Дима">
    </label>
    <label>Сумма (₽)
      <input type="number" id="debtAmount" placeholder="0" inputmode="numeric">
    </label>
    <label>Заметка (необязательно)
      <input type="text" id="debtNote" placeholder="">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveDebt">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка: Категории -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>⚙️ Категории расходов</h3>
    <div id="categoriesList" style="margin-bottom:12px;"></div>
    <label>Добавить категорию
      <input type="text" id="newCategory" placeholder="Название">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Закрыть</button>
      <button class="btn-save" id="addCategory">Добавить</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'koshel_v1';
const CATEGORIES_KEY = 'koshel_categories_v1';
const DEBTS_KEY = 'koshel_debts_v1';

const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                   'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT = ['янв','фев','мар','апр','мая','июн',
                      'июл','авг','сен','окт','ноя','дек'];

const DEFAULT_CATEGORIES = [
  '🍔 Еда', '🚗 Транспорт', '🏠 Жильё', '📱 Связь',
  '💊 Здоровье', '👕 Одежда', '🎉 Развлечения', '📦 Прочее'
];

const PIE_COLORS = [
  '#4caf50', '#2196f3', '#ff9800', '#9c27b0',
  '#f44336', '#00bcd4', '#ffc107', '#795548',
  '#e91e63', '#3f51b5'
];

let state = loadState();
let categories = loadCategories();
let debts = loadDebts();
let viewMonth = new Date();
let currentDebtTab = 'i-owe';
let calMonth = new Date();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { operations: [] };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function loadCategories() {
  try {
    const raw = localStorage.getItem(CATEGORIES_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return [...DEFAULT_CATEGORIES];
}
function saveCategories() { localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories)); }

function loadDebts() {
  try {
    const raw = localStorage.getItem(DEBTS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return [];
}
function saveDebts() { localStorage.setItem(DEBTS_KEY, JSON.stringify(debts)); }

function monthKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabel(date) {
  const d = new Date(date);
  return `${MONTHS_RU[d.getMonth()]} ${d.getFullYear()}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yesterdayISO() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtMoney(n) {
  const abs = Math.abs(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '−' : '') + abs + ' ₽';
}
function fmtDate(iso) {
  if (!iso) return '—';
  const parts = iso.split('-');
  return `${parts[2]}.${parts[1]}`;
}

function isMonthClosed(key) {
  return state.operations.some(op => op.type === 'salary' && op.monthKey === key);
}

function getMonthSummary(key) {
  const ops = state.operations.filter(op => op.monthKey === key);
  const salary = ops.filter(o => o.type === 'shift').reduce((s, o) => s + o.salary, 0);
  const tips = ops.filter(o => o.type === 'shift' || o.type === 'tip')
    .reduce((s, o) => s + (o.tips || 0), 0);
  const advance = ops.filter(o => o.type === 'advance').reduce((s, o) => s + o.amount, 0);
  const expenses = ops.filter(o => o.type === 'expense').reduce((s, o) => s + o.amount, 0);
  const salaryOp = ops.find(o => o.type === 'salary');
  const fact = salaryOp ? salaryOp.fact : null;
  const toReceive = salary - advance;
  const savings = tips - expenses;
  const closed = isMonthClosed(key);
  return { salary, tips, advance, expenses, fact, toReceive, savings, closed };
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(el) { el.closest('.modal-bg').classList.remove('open'); }

    <div class="summary-row accent">
      <span>💵 К получению:</span>
      <b class="amount">${fmtMoney(s.toReceive)}</b>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-row">
      <span>💵 Чаевые:</span>
      <b class="amount">${fmtMoney(s.tips)}</b>
    </div>

      <span>➖ Расходы:</span>
      <b class="amount">${fmtMoney(s.expenses)}</b>

  if (s.closed && s.fact !== null) {
    const diff = s.fact - s.toReceive;
    html += `
      <div class="summary-row">
        <span>💼 Фактически ЗП:</span>
        <b class="amount">${fmtMoney(s.fact)}</b>
      </div>
      <div class="summary-row ${diff >= 0 ? 'positive' : 'negative'}">
        <span>📉 Разница ЗП:</span>
        <b class="amount">${fmtMoney(diff)}</b>
      </div>
      <div class="summary-divider"></div>
    `;
  }

  html += `
    <div class="big-amount ${s.savings >= 0 ? 'positive' : 'negative'}">
      ${s.savings >= 0 ? '💰 Экономия: ' : '💸 Перерасход: '}
      ${fmtMoney(s.savings)}
    </div>
  `;

  document.getElementById('summary').innerHTML = html;

  const ops = state.operations
    .filter(op => op.monthKey === key)
    .sort((a, b) => b.timestamp - a.timestamp);

  const histEl = document.getElementById('historyList');
  if (ops.length === 0) {
    histEl.innerHTML = '<div class="empty">Нет операций за этот месяц</div>';
  } else {
    histEl.innerHTML = ops.slice(0, 30).map(op => {
      let icon = '•', label = '', amount = '', cls = 'neutral';
      if (op.type === 'shift') { icon = '📊'; label = 'Смена'; amount = fmtMoney(op.salary + (op.tips || 0)); cls = 'income'; }
      else if (op.type === 'tip') { icon = '💵'; label = 'Чаевые'; amount = fmtMoney(op.tips); cls = 'income'; }
      else if (op.type === 'expense') { icon = '➖'; label = op.category || 'Расход'; amount = '−' + fmtMoney(op.amount); cls = 'expense'; }
      else if (op.type === 'advance') { icon = '🏦'; label = 'Аванс'; amount = fmtMoney(op.amount); cls = 'neutral'; }
      else if (op.type === 'salary') { icon = '💼'; label = 'ЗП получена'; amount = fmtMoney(op.fact); cls = 'neutral'; }
      return `
        <div class="history-item">
          <div>
            <span class="type-icon">${icon}</span>
            <span>${label}</span>
            <span class="date"> · ${fmtDate(op.date)}</span>
          </div>
          <div class="amount ${cls}">${amount}</div>
        </div>
      `;
    }).join('');
  }

  const salaryBtn = document.getElementById('salaryBtn');
  const prev = new Date(viewMonth);
  prev.setMonth(prev.getMonth() - 1);
  const prevKey = monthKey(prev);
  const hasPrevToClose = !isMonthClosed(prevKey) && state.operations.some(o => o.monthKey === prevKey);

  if (isMonthClosed(key)) {
    salaryBtn.textContent = '✅ Месяц закрыт';
    salaryBtn.disabled = true;
    salaryBtn.style.opacity = '0.5';
  } else if (hasPrevToClose) {
    salaryBtn.textContent = `💼 Получил ЗП за ${MONTHS_SHORT[prev.getMonth()]}`;
    salaryBtn.disabled = false;
    salaryBtn.style.opacity = '1';
  } else {
    salaryBtn.textContent = '💼 Получил ЗП';
    salaryBtn.disabled = false;
    salaryBtn.style.opacity = '1';
  }
}

document.getElementById('reportBtn').onclick = () => {
  const key = monthKey(viewMonth);
  const ops = state.operations.filter(o => o.monthKey === key);
  const s = getMonthSummary(key);
  const shifts = ops.filter(o => o.type === 'shift');
  const avgSalary = shifts.length ? Math.round(shifts.reduce((sum,o) => sum + o.salary, 0) / shifts.length) : 0;

  const parts = key.split('-').map(Number);
  const daysInMonth = new Date(parts[0], parts[1], 0).getDate();
  const dailyIn = {}, dailyOut = {};
  for (let d = 1; d <= daysInMonth; d++) { dailyIn[d] = 0; dailyOut[d] = 0; }
  ops.forEach(o => {
    const day = parseInt(o.date.split('-')[2]);
    if (o.type === 'shift') dailyIn[day] += o.salary + (o.tips || 0);
    else if (o.type === 'tip') dailyIn[day] += o.tips;
    else if (o.type === 'expense') dailyOut[day] += o.amount;
  });

  const maxIn = Math.max(...Object.values(dailyIn), 1);
  const maxOut = Math.max(...Object.values(dailyOut), 1);
  const maxVal = Math.max(maxIn, maxOut);

  let chartHtml = '<div class="chart-days">';
  for (let d = 1; d <= daysInMonth; d++) {
    const hIn = dailyIn[d] ? Math.max(2, (dailyIn[d] / maxVal) * 150) : 0;
    const hOut = dailyOut[d] ? Math.max(2, (dailyOut[d] / maxVal) * 150) : 0;
    chartHtml += `
      <div class="chart-day-col">
        ${hIn ? `<div class="bar-in" style="height:${hIn}px"></div>` : ''}
        ${hOut ? `<div class="bar-out" style="height:${hOut}px"></div>` : ''}
        ${d % 5 === 0 || d === 1 ? `<div class="day-num">${d}</div>` : ''}
      </div>
    `;
  }
  chartHtml += '</div>';
  chartHtml += `
    <div class="chart-legend">
      <span class="green">Доход</span>
      <span class="red">Расход</span>
    </div>
  `;

  const byCategory = {};
  ops.filter(o => o.type === 'expense').forEach(o => {
    byCategory[o.category] = (byCategory[o.category] || 0) + o.amount;
  });
  const catEntries = Object.entries(byCategory).sort((a,b) => b[1] - a[1]);
  const totalExp = catEntries.reduce((sum, [,v]) => sum + v, 0);

  let pieHtml = '';
  if (catEntries.length > 0) {
    let acc = 0;
    const stops = catEntries.map(([, val], i) => {
      const pct = (val / totalExp) * 100;
      const start = acc;
      acc += pct;
      return `${PIE_COLORS[i % PIE_COLORS.length]} ${start}% ${acc}%`;
    }).join(', ');

    pieHtml = `
      <h4 style="margin:16px 0 8px;font-size:13px;color:#888;">🥧 По категориям</h4>
      <div class="pie-wrap">
        <div class="pie" style="background: conic-gradient(${stops});"></div>
        <div class="pie-legend">
          ${catEntries.map(([cat, val], i) => {
            const pct = Math.round((val / totalExp) * 100);
            return `
              <div class="pie-legend-row">
                <span>
                  <span class="color-dot" style="background:${PIE_COLORS[i % PIE_COLORS.length]};"></span>
                  ${cat}
                </span>
                <span class="amount">${fmtMoney(val)} <span style="color:#888;font-size:11px;">${pct}%</span></span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  let html = `
    <div class="profit-preview">
      <div class="row"><span>Смен отработано:</span><b>${shifts.length}</b></div>
      <div class="row"><span>Средняя ЗП за смену:</span><b>${fmtMoney(avgSalary)}</b></div>
      <div class="row"><span>Всего ЗП:</span><b>${fmtMoney(s.salary)}</b></div>

      <div class="row"><span>Расходы:</span><b>${fmtMoney(s.expenses)}</b></div>
      <div class="row diff ${s.savings >= 0 ? 'positive' : 'negative'}">
        <span>${s.savings >= 0 ? '💰 Экономия' : '💸 Перерасход'}:</span>
        <b>${fmtMoney(s.savings)}</b>
      </div>
    </div>
    <h4 style="margin:16px 0 8px;font-size:13px;color:#888;">📊 По дням месяца</h4>
    ${chartHtml}
    ${pieHtml}
  `;

  document.getElementById('reportContent').innerHTML = html;
  openModal('reportModal');
};

function renderCalendar() {
  const year = calMonth.getFullYear();
  const monthNum = calMonth.getMonth();
  document.getElementById('calendarTitle').textContent = `📅 ${MONTHS_RU[monthNum]} ${year}`;

  const key = monthKey(calMonth);
  const ops = state.operations.filter(o => o.monthKey === key);

  const dailyIn = {}, dailyOut = {};
  ops.forEach(o => {
    const day = parseInt(o.date.split('-')[2]);
    if (!dailyIn[day]) dailyIn[day] = 0;
    if (!dailyOut[day]) dailyOut[day] = 0;
    if (o.type === 'shift') dailyIn[day] += o.salary + (o.tips || 0);
    else if (o.type === 'tip') dailyIn[day] += o.tips;
    else if (o.type === 'expense') dailyOut[day] += o.amount;
  });

  const firstDay = new Date(year, monthNum, 1).getDay();
  const daysInMonth = new Date(year, monthNum + 1, 0).getDate();
  const offset = (firstDay === 0 ? 6 : firstDay - 1);

  const today = new Date();
  const isThisMonth = today.getFullYear() === year && today.getMonth() === monthNum;
  const todayDay = today.getDate();

  let html = '';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => {
    html += `<div class="cal-head">${d}</div>`;
  });
  for (let i = 0; i < offset; i++) {
    html += `<div class="cal-day empty-day"></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const inc = dailyIn[d] || 0;
    const out = dailyOut[d] || 0;
    let cls = '';
    if (inc > 0 && inc >= out) cls = 'green';
    else if (inc > 0 && inc < out) cls = 'yellow';
    else if (out > 0) cls = 'red';
    const isToday = isThisMonth && d === todayDay;
    const amountText = inc > 0 ? '+' + Math.round(inc) : (out > 0 ? '−' + Math.round(out) : '');
    html += `
      <div class="cal-day ${cls} ${isToday ? 'today' : ''}" data-day="${d}">
        <div class="day-num">${d}</div>
        <div class="day-amount">${amountText}</div>
      </div>
    `;
  }

  document.getElementById('calendarGrid').innerHTML = html;

  document.querySelectorAll('#calendarGrid .cal-day:not(.empty-day)').forEach(el => {
    el.onclick = () => showDayDetail(parseInt(el.dataset.day));
  });
}

function showDayDetail(day) {
  const dateStr = `${calMonth.getFullYear()}-${String(calMonth.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const ops = state.operations.filter(o => o.date === dateStr);

  if (ops.length === 0) {
    document.getElementById('calendarDayDetail').innerHTML = `
      <div class="empty">Нет операций за ${fmtDate(dateStr)}</div>
    `;
    return;
  }

  const html = ops.map(op => {
    let icon = '•', label = '', amount = '', cls = 'neutral';
    if (op.type === 'shift') { icon = '📊'; label = 'Смена'; amount = fmtMoney(op.salary + (op.tips||0)); cls = 'income'; }
    else if (op.type === 'tip') { icon = '💵'; label = 'Чаевые'; amount = fmtMoney(op.tips); cls = 'income'; }
    else if (op.type === 'expense') { icon = '➖'; label = op.category; amount = '−' + fmtMoney(op.amount); cls = 'expense'; }
    else if (op.type === 'advance') { icon = '🏦'; label = 'Аванс'; amount = fmtMoney(op.amount); cls = 'neutral'; }
    else if (op.type === 'salary') { icon = '💼'; label = 'ЗП факт'; amount = fmtMoney(op.fact); cls = 'neutral'; }
    return `
      <div class="history-item">
        <div><span class="type-icon">${icon}</span>${label}</div>
        <div class="amount ${cls}">${amount}</div>
      </div>
    `;
  }).join('');

  document.getElementById('calendarDayDetail').innerHTML = `
    <h4 style="font-size:13px;color:#888;margin:0 0 6px;">${fmtDate(dateStr)}</h4>
    ${html}
  `;
}

function renderDebts() {
  const filtered = debts.filter(d => d.type === currentDebtTab);
  const active = filtered.filter(d => !d.closed);
  const closed = filtered.filter(d => d.closed);

  const el = document.getElementById('debtsList');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty">Нет долгов</div>';
    return;
  }

  const htmlActive = active.map(d => debtHtml(d)).join('');
  const htmlClosed = closed.length
    ? `<h4 style="font-size:12px;color:#666;margin:14px 0 8px;text-transform:uppercase;">Закрытые</h4>${closed.map(d => debtHtml(d)).join('')}`
    : '';

  el.innerHTML = htmlActive + htmlClosed;

  el.querySelectorAll('[data-close-debt]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.closeDebt;
      const debt = debts.find(d => d.id === id);
      if (!debt) return;
      if (!confirm(`Закрыть долг с ${debt.name}?`)) return;
      debt.closed = true;
      debt.closedAt = Date.now();
      saveDebts();
      renderDebts();
    };
  });
}

  return `
    <div class="debt-item ${d.closed ? 'closed' : ''}">
      <div class="top">
        <span class="name">${d.name}</span>
        <span class="sum ${sumClass}">${fmtMoney(d.amount)}</span>
      </div>
      <div class="bottom">
        <span>${d.note ? d.note + ' · ' : ''}${fmtDate(d.date)}</span>
        ${!d.closed ? `<button class="btn-close-debt" data-close-debt="${d.id}">Вернул</button>` : '<span>✅ закрыт</span>'}
      </div>
    </div>
  `;
}

document.getElementById('addDebtBtn').onclick = () => {
  document.getElementById('debtType').value = currentDebtTab;
  document.getElementById('debtName').value = '';
  document.getElementById('debtAmount').value = '';
  document.getElementById('debtNote').value = '';
  openModal('debtAddModal');
};
document.getElementById('saveDebt').onclick = () => {
  const type = document.getElementById('debtType').value;
  const name = document.getElementById('debtName').value.trim();
  const amount = parseInt(document.getElementById('debtAmount').value) || 0;
  const note = document.getElementById('debtNote').value.trim();
  if (!name) return alert('Введи имя');
  if (amount === 0) return alert('Введи сумму');
  debts.push({
    id: Date.now() + Math.random().toString(36).slice(2, 6),
    type, name, amount, note,
    date: todayISO(),
    closed: false,
    timestamp: Date.now(),
  });
  saveDebts();
  closeModal(document.getElementById('saveDebt'));
  renderDebts();
};

// ===== КАТЕГОРИИ =====
document.getElementById('settingsBtn').onclick = () => {
  renderCategories();
  openModal('settingsModal');
};
function renderCategories() {
  const el = document.getElementById('categoriesList');
  if (categories.length === 0) {
    el.innerHTML = '<div class="empty">Нет категорий</div>';
    return;
  }
  el.innerHTML = categories.map((c, i) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a2a;">
      <span>${c}</span>
      <button data-del-cat="${i}" style="background:transparent;border:none;color:#f44336;font-size:16px;cursor:pointer;">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('[data-del-cat]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.delCat);
      if (!confirm(`Удалить категорию "${categories[i]}"?`)) return;
      categories.splice(i, 1);
      saveCategories();
      renderCategories();
    };
  });
}
document.getElementById('addCategory').onclick = () => {
  const val = document.getElementById('newCategory').value.trim();
  if (!val) return;
  if (categories.includes(val)) return alert('Такая категория уже есть');
  categories.push(val);
  saveCategories();
  document.getElementById('newCategory').value = '';
  renderCategories();
};

// ===== CSV =====
document.getElementById('exportBtn').onclick = () => {
  if (state.operations.length === 0) return alert('Нет данных');

  const incomeRows = [['Дата','Тип','Сумма','Чаевые','Месяц']];
  state.operations
    .filter(o => ['shift','tip','advance','salary'].includes(o.type))
    .sort((a,b) => a.timestamp - b.timestamp)
    .forEach(o => {
      if (o.type === 'shift') incomeRows.push([o.date, 'Смена', o.salary, o.tips, o.monthKey]);
      else if (o.type === 'tip') incomeRows.push([o.date, 'Чаевые', o.tips, o.tips, o.monthKey]);
      else if (o.type === 'advance') incomeRows.push([o.date, 'Аванс', o.amount, 0, o.monthKey]);
      else if (o.type === 'salary') incomeRows.push([o.date, 'ЗП факт', o.fact, 0, o.monthKey]);
    });
  downloadCSV(incomeRows, `доходы_${todayISO()}.csv`);

  const expenseRows = [['Дата','Сумма','Категория','Заметка','Месяц']];
  state.operations
    .filter(o => o.type === 'expense')
    .sort((a,b) => a.timestamp - b.timestamp)
    .forEach(o => {
      expenseRows.push([o.date, o.amount, o.category, o.note || '', o.monthKey]);
    });
  setTimeout(() => downloadCSV(expenseRows, `расходы_${todayISO()}.csv`), 300);
};

function downloadCSV(rows, filename) {
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// ===== НАВИГАЦИЯ МЕСЯЦЕВ =====
document.getElementById('prevMonth').onclick = () => {
  viewMonth = new Date(viewMonth);
  viewMonth.setMonth(viewMonth.getMonth() - 1);
  render();
};
document.getElementById('nextMonth').onclick = () => {
  viewMonth = new Date(viewMonth);
  viewMonth.setMonth(viewMonth.getMonth() + 1);
  render();
};

// ===== PWA =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
setInterval(render, 60000);
</script>
