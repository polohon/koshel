<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<title>Кошель</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #121212; color: #fff; margin: 0;
    padding: 10px; padding-bottom: 90px;
    user-select: none; -webkit-user-select: none;
  }
  h1 { font-size: 18px; text-align: center; margin: 0 0 8px; color: #eee; }

  .month-nav {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin-bottom: 12px;
  }
  .month-nav button {
    background: #2a2a2a; color: #fff; border: none;
    padding: 6px 12px; border-radius: 8px; font-size: 16px;
    cursor: pointer;
  }
  .month-nav .month-title {
    font-size: 17px; font-weight: 700; min-width: 150px; text-align: center;
  }

  .summary {
    background: #1e1e1e; border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .summary h2 {
    font-size: 14px; color: #888; margin: 0 0 10px;
    text-transform: uppercase; font-weight: 600;
  }
  .summary-row {
    display: flex; justify-content: space-between;
    font-size: 14px; padding: 5px 0; color: #bbb;
  }
  .summary-row b { color: #fff; font-weight: 700; }
  .summary-row .amount { font-family: ui-monospace, monospace; }
  .summary-row.positive .amount { color: #4caf50; }
  .summary-row.negative .amount { color: #f44336; }
  .summary-row.accent .amount { color: #4fc3f7; }

  .summary-divider {
    height: 1px; background: #333; margin: 8px 0;
  }

  .big-amount {
    font-size: 24px; font-weight: 800;
    font-family: ui-monospace, monospace;
    text-align: center; padding: 12px 0;
  }
  .big-amount.positive { color: #4caf50; }
  .big-amount.negative { color: #f44336; }
  .big-amount.accent { color: #4fc3f7; }

  .actions {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 12px;
  }
  .actions button {
    padding: 14px 10px; border: none; border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    color: #fff;
  }
  .actions button:active { transform: scale(0.97); }
  .actions .full { grid-column: 1 / -1; }
  .btn-tip    { background: #4caf50; }
  .btn-shift  { background: #2196f3; }
  .btn-expense{ background: #f44336; }
  .btn-advance{ background: #ff9800; }
  .btn-salary { background: #9c27b0; }

  .history {
    background: #1e1e1e; border-radius: 12px; padding: 12px;
    margin-bottom: 12px;
  }
  .history h2 {
    font-size: 14px; color: #888; margin: 0 0 10px;
    text-transform: uppercase; font-weight: 600;
  }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid #2a2a2a;
    font-size: 13px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .type-icon { margin-right: 6px; }
  .history-item .date { color: #888; font-size: 11px; }
  .history-item .amount {
    font-family: ui-monospace, monospace;
    font-weight: 700;
  }
  .history-item .amount.income { color: #4caf50; }
  .history-item .amount.expense { color: #f44336; }
  .history-item .amount.neutral { color: #4fc3f7; }

  .top-bar {
    display: flex; justify-content: center; gap: 6px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .top-bar button {
    background: #2a2a2a; color: #fff; border: none;
    padding: 7px 12px; border-radius: 8px; font-size: 12px;
    font-weight: 600; cursor: pointer;
  }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #1e1e1e; border-radius: 14px; padding: 18px;
    width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 14px; font-size: 17px; }
  .modal label {
    display: block; margin-bottom: 12px;
    font-size: 13px; color: #888;
  }
  .modal label input, .modal label select {
    display: block; width: 100%; margin-top: 4px;
    padding: 10px; background: #121212; color: #fff;
    border: 1px solid #333; border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
  }
  .modal label input:focus, .modal label select:focus {
    outline: none; border-color: #4fc3f7;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 12px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn-save { background: #4caf50; color: #fff; }
  .btn-cancel { background: #444; color: #fff; }
  .btn-danger { background: #f44336; color: #fff; }

  .profit-preview {
    background: #121212; border-radius: 8px;
    padding: 10px; margin: 10px 0;
    font-size: 13px; color: #bbb;
  }
  .profit-preview .row {
    display: flex; justify-content: space-between;
    padding: 3px 0;
  }
  .profit-preview .row b { color: #fff; }
  .profit-preview .row.diff {
    padding-top: 8px; margin-top: 8px;
    border-top: 1px solid #333; font-size: 15px;
  }
  .profit-preview .row.diff b { color: #4fc3f7; font-size: 16px; }
  .profit-preview .row.diff.positive b { color: #4caf50; }
  .profit-preview .row.diff.negative b { color: #f44336; }

  .empty {
    text-align: center; color: #666;
    padding: 20px; font-size: 13px;
  }
</style>
</head>
<body>

<h1>💰 Кошель</h1>

<div class="month-nav">
  <button id="prevMonth">◀</button>
  <div class="month-title" id="monthTitle">Сентябрь 2026</div>
  <button id="nextMonth">▶</button>
</div>

<div class="summary" id="summary"></div>

<div class="actions">
  <button class="btn-shift" id="shiftBtn">📊 Смена</button>
  <button class="btn-tip" id="tipBtn">💵 Чаевые</button>
  <button class="btn-expense" id="expenseBtn">➖ Расход</button>
  <button class="btn-advance" id="advanceBtn">🏦 Аванс</button>
  <button class="btn-salary full" id="salaryBtn">💼 Получил ЗП</button>
</div>

<div class="history">
  <h2>📋 Последние операции</h2>
  <div id="historyList"></div>
</div>

<div class="top-bar">
  <button id="reportBtn">📊 Отчёт</button>
  <button id="exportBtn">💾 CSV</button>
  <button id="settingsBtn">⚙️ Категории</button>
</div>

<div class="modal-bg" id="shiftModal">
  <div class="modal">
    <h3>📊 Смена</h3>
    <label>Дата
      <input type="date" id="shiftDate">
    </label>
    <label>ЗП за смену (₽)
      <input type="number" id="shiftSalary" placeholder="0" inputmode="numeric">
    </label>
    <label>Чаевые (₽)
      <input type="number" id="shiftTips" placeholder="0" inputmode="numeric">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveShift">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="tipModal">
  <div class="modal">
    <h3>💵 Чаевые</h3>
    <label>Дата
      <input type="date" id="tipDate">
    </label>
    <label>Сумма (₽)
      <input type="number" id="tipAmount" placeholder="0" inputmode="numeric">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveTip">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="expenseModal">
  <div class="modal">
    <h3>➖ Расход</h3>
    <label>Дата
      <input type="date" id="expenseDate">
    </label>
    <label>Сумма (₽)
      <input type="number" id="expenseAmount" placeholder="0" inputmode="numeric">
    </label>
    <label>Категория
      <select id="expenseCategory"></select>
    </label>
    <label>Заметка (необязательно)
      <input type="text" id="expenseNote" placeholder="">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveExpense">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="advanceModal">
  <div class="modal">
    <h3>🏦 Аванс</h3>
    <label>Дата
      <input type="date" id="advanceDate">
    </label>
    <label>Сумма (₽)
      <input type="number" id="advanceAmount" placeholder="0" inputmode="numeric">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveAdvance">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="salaryModal">
  <div class="modal">
    <h3 id="salaryTitle">💼 Получил ЗП</h3>
    <div class="profit-preview" id="salaryPreview"></div>
    <label>Фактически получил (₽)
      <input type="number" id="salaryFact" placeholder="0" inputmode="numeric">
    </label>
    <div class="profit-preview" id="salaryDiff" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Отмена</button>
      <button class="btn-save" id="saveSalary">Закрыть месяц</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>⚙️ Категории расходов</h3>
    <div id="categoriesList" style="margin-bottom:12px;"></div>
    <label>Добавить категорию
      <input type="text" id="newCategory" placeholder="Название">
    </label>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Закрыть</button>
      <button class="btn-save" id="addCategory">Добавить</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="reportModal">
  <div class="modal">
    <h3>📊 Отчёт за месяц</h3>
    <div id="reportContent"></div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close>Закрыть</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'koshel_v1';
const CATEGORIES_KEY = 'koshel_categories_v1';

const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                   'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

const DEFAULT_CATEGORIES = [
  '🍔 Еда', '🚗 Транспорт', '🏠 Жильё', '📱 Связь',
  '💊 Здоровье', '👕 Одежда', '🎉 Развлечения', '📦 Прочее'
];

let state = loadState();
let categories = loadCategories();
let viewMonth = new Date();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { operations: [] };
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function loadCategories() {
  try {
    const raw = localStorage.getItem(CATEGORIES_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return [...DEFAULT_CATEGORIES];
}
function saveCategories() {
  localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
}

function monthKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabel(date) {
  const d = new Date(date);
  return `${MONTHS_RU[d.getMonth()]} ${d.getFullYear()}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtMoney(n) {
  const abs = Math.abs(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '−' : '') + abs + ' ₽';
}
function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}`;
}

function isMonthClosed(key) {
  return state.operations.some(op =>
    op.type === 'salary' && op.monthKey === key
  );
}

function getMonthSummary(key) {
  const ops = state.operations.filter(op => op.monthKey === key);
  const salary = ops.filter(o => o.type === 'shift').reduce((s, o) => s + o.salary, 0);
  const tips = ops.filter(o => o.type === 'shift' || o.type === 'tip')
    .reduce((s, o) => s + (o.tips || 0), 0);
  const advance = ops.filter(o => o.type === 'advance').reduce((s, o) => s + o.amount, 0);
  const expenses = ops.filter(o => o.type === 'expense').reduce((s, o) => s + o.amount, 0);
  const salaryOp = ops.find(o => o.type === 'salary');
  const fact = salaryOp ? salaryOp.fact : null;
  const toReceive = salary - advance;
  const savings = tips - expenses;
  const closed = isMonthClosed(key);

  return { salary, tips, advance, expenses, fact, toReceive, savings, closed };
}

function render() {
  const key = monthKey(viewMonth);
  const s = getMonthSummary(key);

  document.getElementById('monthTitle').textContent = monthLabel(viewMonth);

  const summaryEl = document.getElementById('summary');

  let html = `
    <h2>${s.closed ? '✅ Закрыт' : '📊 Сводка'}</h2>
    <div class="summary-row">
      <span>📊 ЗП накоплено:</span>
      <b class="amount">${fmtMoney(s.salary)}</b>
    </div>
    <div class="summary-row">
      <span>🏦 Аванс:</span>
      <b class="amount">${fmtMoney(s.advance)}</b>
    </div>
    <div class="summary-row accent">
      <span>💵 К получению:</span>
      <b class="amount">${fmtMoney(s.toReceive)}</b>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-row">
      <span>💵 Чаевые:</span>
      <b class="amount">${fmtMoney(s.tips)}</b>
    </div>
    <div class="summary-row">
      <span>➖ Расходы:</span>
      <b class="amount">${fmtMoney(s.expenses)}</b>
    </div>
    <div class="summary-divider"></div>
  `;

  if (s.closed && s.fact !== null) {
    const diff = s.fact - s.toReceive;
    html += `
      <div class="summary-row">
        <span>💼 Фактически ЗП:</span>
        <b class="amount">${fmtMoney(s.fact)}</b>
      </div>
      <div class="summary-row ${diff >= 0 ? 'positive' : 'negative'}">
        <span>📉 Разница ЗП:</span>
        <b class="amount">${fmtMoney(diff)}</b>
      </div>
      <div class="summary-divider"></div>
    `;
  }

  html += `
    <div class="big-amount ${s.savings >= 0 ? 'positive' : 'negative'}">
      ${s.savings >= 0 ? '💰 Экономия: ' : '💸 Перерасход: '}
      ${fmtMoney(s.savings)}
    </div>
  `;

  summaryEl.innerHTML = html;

  const ops = state.operations
    .filter(op => op.monthKey === key)
    .sort((a, b) => b.timestamp - a.timestamp);

  const histEl = document.getElementById('historyList');
  if (ops.length === 0) {
    histEl.innerHTML = '<div class="empty">Нет операций за этот месяц</div>';
  } else {
    histEl.innerHTML = ops.slice(0, 30).map(op => {
      let icon, label, amount, cls;
      if (op.type === 'shift') {
        icon = '📊'; label = 'Смена';
        amount = fmtMoney(op.salary + (op.tips || 0));
        cls = 'income';
      } else if (op.type === 'tip') {
        icon = '💵'; label = 'Чаевые';
        amount = fmtMoney(op.tips);
        cls = 'income';
      } else if (op.type === 'expense') {
        icon = '➖'; label = op.category || 'Расход';
        amount = '−' + fmtMoney(op.amount);
        cls = 'expense';
      } else if (op.type === 'advance') {
        icon = '🏦'; label = 'Аванс';
        amount = fmtMoney(op.amount);
        cls = 'neutral';
      } else if (op.type === 'salary') {
        icon = '💼'; label = 'ЗП получена';
        amount = fmtMoney(op.fact);
        cls = 'neutral';
      }
      return `
        <div class="history-item">
          <div>
            <span class="type-icon">${icon}</span>
            <span>${label}</span>
            <span class="date"> · ${fmtDate(op.date)}</span>
          </div>
          <div class="amount ${cls}">${amount}</div>
        </div>
      `;
    }).join('');
  }

  const salaryBtn = document.getElementById('salaryBtn');
  const prev = new Date(viewMonth);
  prev.setMonth(prev.getMonth() - 1);
  const prevKey = monthKey(prev);
  const hasPrevToClose = !isMonthClosed(prevKey) &&
    state.operations.some(o => o.monthKey === prevKey);

  if (isMonthClosed(key)) {
    salaryBtn.textContent = '✅ Месяц закрыт';
    salaryBtn.disabled = true;
    salaryBtn.style.opacity = '0.5';
  } else if (hasPrevToClose) {
    salaryBtn.textContent = `💼 Получил ЗП за ${monthLabel(prev).split(' ')[0].toLowerCase()}`;
    salaryBtn.disabled = false;
    salaryBtn.style.opacity = '1';
  } else {
    salaryBtn.textContent = '💼 Получил ЗП';
    salaryBtn.disabled = false;
    salaryBtn.style.opacity = '1';
  }
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(el) {
  el.closest('.modal-bg').classList.remove('open');
}

document.getElementById('shiftBtn').onclick = () => {
  document.getElementById('shiftDate').value = todayISO();
  document.getElementById('shiftSalary').value = '';
  document.getElementById('shiftTips').value = '0';
  openModal('shiftModal');
};

document.getElementById('saveShift').onclick = () => {
  const date = document.getElementById('shiftDate').value;
  const salary = parseInt(document.getElementById('shiftSalary').value) || 0;
  const tips = parseInt(document.getElementById('shiftTips').value) || 0;
  if (!date) return alert('Укажи дату');
  if (salary === 0 && tips === 0) return alert('Введи сумму');

  state.operations.push({
    id: Date.now() + Math.random().toString(36).slice(2, 6),
    type: 'shift',
    date,
    monthKey: monthKey(date),
    salary,
    tips,
    timestamp: Date.now(),
  });
  saveState();
  closeModal(document.getElementById('saveShift'));
  render();
};

document.getElementById('tipBtn').onclick = () => {
  document.getElementById('tipDate').value = todayISO();
  document.getElementById('tipAmount').value = '';
  openModal('tipModal');
};

document.getElementById('saveTip').onclick = () => {
  const date = document.getElementById('tipDate').value;
  const tips = parseInt(document.getElementById('tipAmount').value) || 0;
  if (!date) return alert('Укажи дату');
  if (tips === 0) return alert('Введи сумму');

  state.operations.push({
    id: Date.now() + Math.random().toString(36).slice(2, 6),
    type: 'tip',
    date,
    monthKey: monthKey(date),
    tips,
    timestamp: Date.now(),
  });
  saveState();
  closeModal(document.getElementById('saveTip'));
  render();
};

document.getElementById('expenseBtn').onclick = () => {
  document.getElementById('expenseDate').value = todayISO();
  document.getElementById('expenseAmount').value = '';
  document.getElementById('expenseNote').value = '';
  const select = document.getElementById('expenseCategory');
  select.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
  openModal('expenseModal');
};

document.getElementById('saveExpense').onclick = () => {
  const date = document.getElementById('expenseDate').value;
  const amount = parseInt(document.getElementById('expenseAmount').value) || 0;
  const category = document.getElementById('expenseCategory').value;
  const note = document.getElementById('expenseNote').value.trim();
  if (!date) return alert('Укажи дату');
  if (amount === 0) return alert('Введи сумму');

  state.operations.push({
    id: Date.now() + Math.random().toString(36).slice(2, 6),
    type: 'expense',
    date,
    monthKey: monthKey(date),
    amount,
    category,
    note,
    timestamp: Date.now(),
  });
  saveState();
  closeModal(document.getElementById('saveExpense'));
  render();
};

document.getElementById('advanceBtn').onclick = () => {
  document.getElementById('advanceDate').value = todayISO();
  document.getElementById('advanceAmount').value = '';
  openModal('advanceModal');
};

document.getElementById('saveAdvance').onclick = () => {
  const date = document.getElementById('advanceDate').value;
  const amount = parseInt(document.getElementById('advanceAmount').value) || 0;
  if (!date) return alert('Укажи дату');
  if (amount === 0) return alert('Введи сумму');

  state.operations.push({
    id: Date.now() + Math.random().toString(36).slice(2, 6),
    type: 'advance',
    date,
    monthKey: monthKey(date),
    amount,
    timestamp: Date.now(),
  });
  saveState();
  closeModal(document.getElementById('saveAdvance'));
  render();
};

document.getElementById('salaryBtn').onclick = () => {
  const prev = new Date(viewMonth);
  prev.setMonth(prev.getMonth() - 1);
  const prevKey = monthKey(prev);

  let closeKey, closeMonthDate;
  if (!isMonthClosed(prevKey) && state.operations.some(o => o.monthKey === prevKey)) {
    closeKey = prevKey;
    closeMonthDate = prev;
  } else if (!isMonthClosed(monthKey(viewMonth)) && state.operations.some(o => o.monthKey === monthKey(viewMonth))) {
    closeKey = monthKey(viewMonth);
    closeMonthDate = viewMonth;
  } else {
    return alert('Нет незакрытых месяцев с операциями');
  }

  const s = getMonthSummary(closeKey);
  document.getElementById('salaryTitle').textContent = '💼 Закрытие ' + monthLabel(closeMonthDate);
  document.getElementById('salaryPreview').innerHTML = `
    <div class="row"><span>Прогноз ЗП:</span><b>${fmtMoney(s.salary)}</b></div>
    <div class="row"><span>Аванс:</span><b>−${fmtMoney(s.advance)}</b></div>
    <div class="row"><span>К получению:</span><b>${fmtMoney(s.toReceive)}</b></div>
  `;
  document.getElementById('salaryFact').value = '';
  document.getElementById('salaryDiff').style.display = 'none';
  document.getElementById('salaryModal').dataset.closeKey = closeKey;
  openModal('salaryModal');
};

document.getElementById('salaryFact').addEventListener('input', () => {
  const fact = parseInt(document.getElementById('salaryFact').value) || 0;
  const closeKey = document.getElementById('salaryModal').dataset.closeKey;
  const s = getMonthSummary(closeKey);
  const diff = fact - s.toReceive;
  const diffEl = document.getElementById('salaryDiff');
  diffEl.style.display = 'block';
  diffEl.className = 'profit-preview';
  diffEl.innerHTML = `
    <div class="row diff ${diff >= 0 ? 'positive' : 'negative'}">
      <span>Разница:</span>
      <b>${fmtMoney(diff)}</b>
    </div>
  `;
});

document.getElementById('saveSalary').onclick = () => {
  const fact = parseInt(document.getElementById('salaryFact').value) || 0;
  const closeKey = document.getElementById('salaryModal').dataset.closeKey;
  if (fact === 0) {
    if (!confirm('Получил 0 ₽? Закрыть месяц?')) return;
  }
  const date = todayISO();
  state.operations.push({
    id: Date.now() + Math.random().toString(36).slice(2, 6),
    type: 'salary',
    date,
    monthKey: closeKey,
    fact,
    timestamp: Date.now(),
  });
  saveState();
  closeModal(document.getElementById('saveSalary'));
  render();
};

document.getElementById('settingsBtn').onclick = () => {
  renderCategories();
  openModal('settingsModal');
};

function renderCategories() {
  const el = document.getElementById('categoriesList');
  if (categories.length === 0) {
    el.innerHTML = '<div class="empty">Нет категорий</div>';
    return;
  }
  el.innerHTML = categories.map((c, i) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a2a;">
      <span>${c}</span>
      <button data-del-cat="${i}" style="background:transparent;border:none;color:#f44336;font-size:16px;cursor:pointer;">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('[data-del-cat]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.delCat);
      if (!confirm(`Удалить категорию "${categories[i]}"?`)) return;
      categories.splice(i, 1);
      saveCategories();
      renderCategories();
    };
  });
}

document.getElementById('addCategory').onclick = () => {
  const val = document.getElementById('newCategory').value.trim();
  if (!val) return;
  if (categories.includes(val)) return alert('Такая категория уже есть');
  categories.push(val);
  saveCategories();
  document.getElementById('newCategory').value = '';
  renderCategories();
};

document.getElementById('reportBtn').onclick = () => {
  const key = monthKey(viewMonth);
  const ops = state.operations.filter(o => o.monthKey === key);

  const byCategory = {};
  ops.filter(o => o.type === 'expense').forEach(o => {
    byCategory[o.category] = (byCategory[o.category] || 0) + o.amount;
  });

  const shifts = ops.filter(o => o.type === 'shift');
  const avgSalary = shifts.length ? Math.round(shifts.reduce((s,o) => s + o.salary, 0) / shifts.length) : 0;

  const s = getMonthSummary(key);

  let html = `
    <div class="profit-preview">
      <div class="row"><span>Смен отработано:</span><b>${shifts.length}</b></div>
      <div class="row"><span>Средняя ЗП за смену:</span><b>${fmtMoney(avgSalary)}</b></div>
      <div class="row"><span>Всего ЗП:</span><b>${fmtMoney(s.salary)}</b></div>
      <div class="row"><span>Аванс:</span><b>${fmtMoney(s.advance)}</b></div>
      <div class="row"><span>Чаевые:</span><b>${fmtMoney(s.tips)}</b></div>
      <div class="row"><span>Расходы:</span><b>${fmtMoney(s.expenses)}</b></div>
      <div class="row diff ${s.savings >= 0 ? 'positive' : 'negative'}">
        <span>${s.savings >= 0 ? '💰 Экономия' : '💸 Перерасход'}:</span>
        <b>${fmtMoney(s.savings)}</b>
      </div>
    </div>
  `;

  if (Object.keys(byCategory).length) {
    html += '<h4 style="margin:16px 0 8px;font-size:13px;color:#888;">По категориям:</h4>';
    html += Object.entries(byCategory)
      .sort((a, b) => b[1] - a[1])
      .map(([cat, sum]) => `
        <div class="summary-row">
          <span>${cat}</span>
          <b class="amount">${fmtMoney(sum)}</b>
        </div>
      `).join('');
  }

  document.getElementById('reportContent').innerHTML = html;
  openModal('reportModal');
};

document.getElementById('exportBtn').onclick = () => {
  if (state.operations.length === 0) return alert('Нет данных');

  const incomeRows = [['Дата','Тип','Сумма','Чаевые','Месяц']];
  state.operations
    .filter(o => ['shift','tip','advance','salary'].includes(o.type))
    .sort((a,b) => a.timestamp - b.timestamp)
    .forEach(o => {
      if (o.type === 'shift') incomeRows.push([o.date, 'Смена', o.salary, o.tips, o.monthKey]);
      else if (o.type === 'tip') incomeRows.push([o.date, 'Чаевые', o.tips, o.tips, o.monthKey]);
      else if (o.type === 'advance') incomeRows.push([o.date, 'Аванс', o.amount, 0, o.monthKey]);
      else if (o.type === 'salary') incomeRows.push([o.date, 'ЗП факт', o.fact, 0, o.monthKey]);
    });
  downloadCSV(incomeRows, `доходы_${todayISO()}.csv`);

  const expenseRows = [['Дата','Сумма','Категория','Заметка','Месяц']];
  state.operations
    .filter(o => o.type === 'expense')
    .sort((a,b) => a.timestamp - b.timestamp)
    .forEach(o => {
      expenseRows.push([o.date, o.amount, o.category, o.note || '', o.monthKey]);
    });
  setTimeout(() => downloadCSV(expenseRows, `расходы_${todayISO()}.csv`), 300);
};

function downloadCSV(rows, filename) {
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('prevMonth').onclick = () => {
  viewMonth = new Date(viewMonth);
  viewMonth.setMonth(viewMonth.getMonth() - 1);
  render();
};
document.getElementById('nextMonth').onclick = () => {
  viewMonth = new Date(viewMonth);
  viewMonth.setMonth(viewMonth.getMonth() + 1);
  render();
};

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.onclick = (e) => closeModal(e.target);
});
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.onclick = (e) => { if (e.target === bg) bg.classList.remove('open'); };
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
